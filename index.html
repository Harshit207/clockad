<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World Clock: Sleek & Minimal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #1a73e8;
      --accent-bg: #eef3fa;
      --card-bg: #fff;
      --card-border: #ebebeb;
      --shadow: 0 2px 12px #0001;
      --radius: 18px;
      --font-main: 'Inter', Arial, sans-serif;
      --text-main: #23272f;
      --text-light: #6c7a89;
      --bg-main: #f6f8fa;
      --bg-dark: #181a20;
      --text-dark: #f6f8fa;
    }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }
    h1 {
      text-align: center;
      margin-top: 38px;
      font-weight: 600;
      font-size: 2em;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .toggle-mode {
      display: flex;
      justify-content: flex-end;
      margin: 0 32px 18px 0;
      gap: 0.5em;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.15em;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      opacity: 0.7;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }
    .toggle-btn.active {
      background: var(--accent-bg);
      opacity: 1;
    }
    #searchBar {
      display: flex;
      justify-content: center;
      margin: 18px 0 6px 0;
      gap: 0.7em;
    }
    #searchInput {
      width: 270px;
      padding: 8px 13px;
      font-size: 1em;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border 0.2s, background 0.2s;
    }
    body.dark #searchInput {
      background: #23272f;
      color: var(--text-dark);
      border-color: #222;
    }
    #resetBtn {
      padding: 8px 14px;
      font-size: 1em;
      border-radius: 9px;
      border: none;
      background: var(--accent-bg);
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    #resetBtn:hover { background: #dbe9fa; }
    .clocks-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      justify-content: center;
      margin: 14px 0 40px 0;
      padding: 0 16px;
    }
    .clock-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      padding: 21px 20px 17px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.18s, transform 0.13s;
      min-width: 220px;
    }
    .clock-card.selected,
    .clock-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px #1a73e830;
      transform: scale(1.025);
    }
    .tz-title {
      font-size: 1.08em;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-main);
    }
    .tz-flag {
      font-size: 1.2em;
    }
    .tz-abbr {
      font-size: 0.98em;
      color: var(--accent);
      padding-left: 5px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .tz-offset {
      font-size: 0.93em;
      color: var(--text-light);
      padding-left: 6px;
      font-weight: 500;
    }
    .digital-time {
      font-family: 'Inter', Arial, sans-serif;
      font-size: 2em;
      letter-spacing: 2px;
      margin-bottom: 7px;
      margin-top: 1px;
      color: var(--accent);
      font-weight: 600;
    }
    .date {
      font-size: 0.98em;
      color: var(--text-light);
      margin-bottom: 7px;
      font-weight: 500;
    }
    canvas.analog-clock {
      display: block;
      margin: 0 auto 2px auto;
      background: #fff;
      border-radius: 50%;
      border: 1px solid var(--accent-bg);
    }
    .card-footer {
      font-size: 0.9em;
      color: var(--text-light);
      margin-top: 5px;
      font-style: italic;
      opacity: 0.7;
    }
    @media (max-width: 600px) {
      .clocks-container { grid-template-columns: 1fr; }
      .clock-card { min-width: 98vw; }
      #searchInput { width: 94vw; }
    }

    /* Fullscreen overlay: no card, just clock and info */
    .fullscreen-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-main);
      color: var(--text-main);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.45s;
    }
    body.dark .fullscreen-overlay {
      background: var(--bg-dark);
      color: var(--text-dark);
    }
    .fullscreen-clock-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: none;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }
    .fullscreen-back-arrow {
      position: fixed;
      top: 26px;
      left: 32px;
      font-size: 2em;
      color: var(--accent);
      background: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      outline: none;
      user-select: none;
      z-index: 9999;
      transition: background 0.2s, color 0.2s;
    }
    .fullscreen-back-arrow:hover {
      background: var(--accent-bg);
      color: var(--text-main);
    }
    .fullscreen-analog-clock {
      background: #fff;
      border-radius: 50%;
      border: 1.5px solid var(--accent-bg);
      margin-bottom: 24px;
      box-shadow: none;
      display: block;
    }
    .fullscreen-title, .fullscreen-digital-time, .fullscreen-date {
      background: none;
      box-shadow: none;
      border: none;
      border-radius: 0;
      margin: 0.5em 0;
      text-align: center;
    }
    .fullscreen-title {
      font-size: 1.15em;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .fullscreen-digital-time {
      font-family: 'Inter', Arial, sans-serif;
      font-size: 2.2em;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 600;
    }
    .fullscreen-abbr {
      font-size: 1em;
      color: var(--accent);
      margin-left: 8px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .fullscreen-offset {
      font-size: 0.98em;
      color: var(--text-light);
      margin-left: 6px;
      font-weight: 500;
    }
    .fullscreen-date {
      font-size: 1em;
      color: var(--text-light);
      margin-bottom: 8px;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .fullscreen-digital-time { font-size: 1.4em; }
      .fullscreen-analog-clock { width: 70vw !important; height: 70vw !important; }
    }
  </style>
</head>
<body>
  <h1>World Clock</h1>
  <div class="toggle-mode">
    <button id="darkModeBtn" class="toggle-btn active">🌙</button>
    <button id="lightModeBtn" class="toggle-btn">☀️</button>
  </div>
  <div id="searchBar">
    <input id="searchInput" type="text" placeholder="Search timezone, city, country..." />
    <button id="resetBtn" style="display:none;">Show All</button>
  </div>
  <div class="clocks-container" id="clocksContainer"></div>
  <div id="fullscreenOverlay" style="display:none;"></div>
  <!-- UI Sounds -->
  <audio id="sound-click" src="https://cdn.jsdelivr.net/gh/Harshit207/ui-assets/mouseclick1.ogg" preload="auto"></audio>
<audio id="sound-release" src="https://cdn.jsdelivr.net/gh/Harshit207/ui-assets/mouserelease1.ogg" preload="auto"></audio>
<audio id="sound-hover" src="https://cdn.jsdelivr.net/gh/Harshit207/ui-assets/rollover2.ogg" preload="auto"></audio>
  <script>
    function playSound(id) {
      var audio = document.getElementById(id);
      if (audio) {
        audio.currentTime = 0;
        audio.play();
      }
    }

    function getFlagEmoji(tz) {
      const flags = {
        "America/New_York": "🇺🇸",
        "America/Chicago": "🇺🇸",
        "America/Los_Angeles": "🇺🇸",
        "America/Toronto": "🇨🇦",
        "Europe/London": "🇬🇧",
        "Europe/Paris": "🇫🇷",
        "Europe/Berlin": "🇩🇪",
        "Asia/Tokyo": "🇯🇵",
        "Asia/Kolkata": "🇮🇳",
        "Asia/Shanghai": "🇨🇳",
        "Australia/Sydney": "🇦🇺",
        "Africa/Johannesburg": "🇿🇦",
        "Pacific/Auckland": "🇳🇿",
        "Europe/Moscow": "🇷🇺",
        "America/Sao_Paulo": "🇧🇷",
        "UTC": "🌍",
      };
      for (const key in flags) {
        if (tz.startsWith(key)) return flags[key];
      }
      if (tz.startsWith("Europe/")) return "🇪🇺";
      if (tz.startsWith("Asia/")) return "🌏";
      if (tz.startsWith("Africa/")) return "🌍";
      if (tz.startsWith("America/")) return "🌎";
      if (tz.startsWith("Australia/")) return "🇦🇺";
      if (tz.startsWith("Pacific/")) return "🌊";
      return "🕰️";
    }
    const featuredZones = [
      "UTC",
      "America/New_York",
      "America/Chicago",
      "America/Los_Angeles",
      "America/Toronto",
      "Europe/London",
      "Europe/Paris",
      "Europe/Berlin",
      "Europe/Moscow",
      "Asia/Tokyo",
      "Asia/Shanghai",
      "Asia/Kolkata",
      "Australia/Sydney",
      "Pacific/Auckland",
      "Africa/Johannesburg",
      "America/Sao_Paulo",
      "America/Mexico_City",
      "Asia/Dubai",
      "Asia/Singapore",
      "Asia/Hong_Kong",
      "Asia/Jakarta",
      "Asia/Seoul",
      "Africa/Cairo",
      "Europe/Istanbul",
      "America/Argentina/Buenos_Aires"
    ];
    const allTimeZones = moment.tz.names();
    let filteredTimeZones = [...featuredZones];
    let selectedZone = null;
    let showAll = false;
    let fullscreenZone = null;

    function drawAnalogClock(canvas, now, isFullscreen) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const radius = w/2 - (isFullscreen ? 14 : 10);
      ctx.save();
      ctx.translate(w/2, h/2);

      // Face
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#dbe9fa";
      ctx.shadowBlur = isFullscreen ? 14 : 7;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = isFullscreen ? 4 : 2;
      ctx.strokeStyle = "#e3eaf2";
      ctx.stroke();

      ctx.save();
      ctx.globalAlpha = 0.07;
      ctx.beginPath();
      ctx.arc(0, 0, radius+6, 0, 2*Math.PI);
      ctx.fillStyle = "#1a73e8";
      ctx.fill();
      ctx.restore();

      // Hour marks
      ctx.strokeStyle = "#c1c7d0";
      for (let i=0; i<12; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI/6);
        ctx.beginPath();
        ctx.moveTo(0, -radius + (isFullscreen ? 10 : 7));
        ctx.lineTo(0, -radius + (isFullscreen ? 22 : 15));
        ctx.lineWidth = isFullscreen ? 2.8 : 1.7;
        ctx.stroke();
        ctx.restore();
      }
      // Hands
      let hour = now.hours() % 12;
      let minute = now.minutes();
      let second = now.seconds();
      let ms = now.milliseconds();

      // Hour hand
      ctx.save();
      ctx.rotate((hour + minute/60) * Math.PI/6);
      ctx.beginPath();
      ctx.moveTo(0, isFullscreen ? 8 : 5);
      ctx.lineTo(0, -radius * 0.43);
      ctx.lineWidth = isFullscreen ? 7 : 4;
      ctx.strokeStyle = "#1a73e8";
      ctx.stroke();
      ctx.restore();

      // Minute hand
      ctx.save();
      ctx.rotate((minute + second/60) * Math.PI/30);
      ctx.beginPath();
      ctx.moveTo(0, isFullscreen ? 10 : 6);
      ctx.lineTo(0, -radius * 0.71);
      ctx.lineWidth = isFullscreen ? 5.2 : 3;
      ctx.strokeStyle = "#23272f";
      ctx.stroke();
      ctx.restore();

      // Second hand
      ctx.save();
      const secFrac = (second + ms/1000);
      ctx.rotate(secFrac * Math.PI/30);
      ctx.beginPath();
      ctx.moveTo(0, isFullscreen ? 12 : 8);
      ctx.lineTo(0, -radius * 0.84);
      ctx.lineWidth = isFullscreen ? 2.2 : 1.2;
      ctx.strokeStyle = "#e64a19";
      ctx.stroke();
      ctx.restore();

      // Center dot
      ctx.beginPath();
      ctx.arc(0,0,isFullscreen ? 7 : 4,0,2*Math.PI);
      ctx.fillStyle = "#1a73e8";
      ctx.fill();

      ctx.restore();
    }

    function getAbbrOffset(now, tz) {
      const abbr = now.tz(tz).format('z');
      const offsetMin = now.tz(tz).utcOffset();
      const offsetH = Math.floor(offsetMin / 60);
      const offsetM = Math.abs(offsetMin % 60);
      const sign = offsetMin >= 0 ? '+' : '-';
      return [abbr, `${sign}${padZero(Math.abs(offsetH))}:${padZero(offsetM)}`];
    }
    function padZero(num) { return num < 10 ? '0' + num : num; }

    function renderClocks() {
      if (fullscreenZone) return;
      const container = document.getElementById('clocksContainer');
      container.innerHTML = "";
      const zones = filteredTimeZones;
      const nowGlobal = moment();
      zones.forEach(tz => {
        const now = moment.tz(nowGlobal, tz);
        const card = document.createElement('div');
        card.className = "clock-card" + (selectedZone === tz ? " selected" : "");
        card.setAttribute('data-tz', tz);
        // Title
        const flag = document.createElement('span');
        flag.className = "tz-flag";
        flag.textContent = getFlagEmoji(tz);
        const title = document.createElement('div');
        title.className = "tz-title";
        title.appendChild(flag);
        title.appendChild(document.createTextNode(tz));
        // Abbr & offset
        const [abbr, offset] = getAbbrOffset(nowGlobal, tz);
        const abbrSpan = document.createElement('span');
        abbrSpan.className = "tz-abbr";
        abbrSpan.textContent = abbr;
        const offsetSpan = document.createElement('span');
        offsetSpan.className = "tz-offset";
        offsetSpan.textContent = `UTC${offset}`;
        title.appendChild(abbrSpan);
        title.appendChild(offsetSpan);
        // Digital time
        const digital = document.createElement('div');
        digital.className = "digital-time";
        digital.textContent = now.format('HH:mm:ss');
        // Date
        const date = document.createElement('div');
        date.className = "date";
        date.textContent = now.format('YYYY-MM-DD (ddd)');
        // Analog clock (canvas)
        const canvas = document.createElement('canvas');
        canvas.className = "analog-clock";
        canvas.width = 88; canvas.height = 88;
        // Footer
        const footer = document.createElement('div');
        footer.className = "card-footer";
        footer.textContent = moment.tz.zone(tz).abbrs[0] ? `Time Zone: ${tz}` : "";

        card.appendChild(title);
        card.appendChild(digital);
        card.appendChild(date);
        card.appendChild(canvas);
        card.appendChild(footer);
        container.appendChild(card);
        drawAnalogClock(canvas, now, false);
      });
    }

    function animateClocks() {
      if (fullscreenZone) {
        updateFullscreenClock();
      } else {
        const container = document.getElementById('clocksContainer');
        [...container.children].forEach(card => {
          const tz = card.getAttribute('data-tz');
          const now = moment.tz(tz);
          const canvas = card.querySelector('canvas');
          drawAnalogClock(canvas, now, false);
          card.querySelector('.digital-time').textContent = now.format('HH:mm:ss');
          card.querySelector('.date').textContent = now.format('YYYY-MM-DD (ddd)');
        });
      }
      requestAnimationFrame(animateClocks);
    }
    setTimeout(animateClocks, 100);

    renderClocks();

    document.getElementById('clocksContainer').addEventListener('click', function(e) {
      let card = e.target.closest('.clock-card');
      if (!card || fullscreenZone) return;
      let tz = card.getAttribute('data-tz');
      fullscreenZone = tz;
      showFullscreenClock(tz);
      playSound('sound-click');
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      let val = e.target.value.trim().toLowerCase();
      selectedZone = null;
      showAll = true;
      if (!val) {
        filteredTimeZones = [...allTimeZones];
        document.getElementById('resetBtn').style.display = 'none';
      } else {
        filteredTimeZones = allTimeZones.filter(tz => tz.toLowerCase().includes(val));
        document.getElementById('resetBtn').style.display = '';
      }
      renderClocks();
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      document.getElementById('searchInput').value = '';
      filteredTimeZones = [...featuredZones];
      selectedZone = null;
      showAll = false;
      renderClocks();
      this.style.display = 'none';
      playSound('sound-back');
    });

    const darkBtn = document.getElementById('darkModeBtn');
    const lightBtn = document.getElementById('lightModeBtn');
    darkBtn.addEventListener('click', function() {
      document.body.classList.add('dark');
      darkBtn.classList.add('active');
      lightBtn.classList.remove('active');
      playSound('sound-mode');
    });
    lightBtn.addEventListener('click', function() {
      document.body.classList.remove('dark');
      darkBtn.classList.remove('active');
      lightBtn.classList.add('active');
      playSound('sound-mode');
    });

    // FULLSCREEN CLOCK: no box, just clock and info
    function showFullscreenClock(tz) {
      const overlay = document.getElementById('fullscreenOverlay');
      overlay.style.display = '';
      overlay.innerHTML = '';
      overlay.className = 'fullscreen-overlay' + (document.body.classList.contains('dark') ? ' dark' : '');

      // Content wrapper
      const content = document.createElement('div');
      content.className = 'fullscreen-clock-content';

      // Back arrow
      const backArrow = document.createElement('div');
      backArrow.className = 'fullscreen-back-arrow';
      backArrow.innerHTML = '&#8592;';
      backArrow.title = "Go Back";
      backArrow.onclick = function() {
        overlay.style.display = 'none';
        fullscreenZone = null;
        renderClocks();
        playSound('sound-back');
      };
      overlay.appendChild(backArrow);

      // Analog clock (big!)
      const canvas = document.createElement('canvas');
      canvas.className = "fullscreen-analog-clock";
      const clockSize = Math.min(window.innerWidth, window.innerHeight) * 0.65;
      canvas.width = clockSize;
      canvas.height = clockSize;
      content.appendChild(canvas);

      // Digital time
      const now = moment.tz(tz);
      const digital = document.createElement('div');
      digital.className = "fullscreen-digital-time";
      digital.textContent = now.format('HH:mm:ss');
      content.appendChild(digital);

      // Timezone info
      const [abbr, offset] = getAbbrOffset(moment(), tz);
      const title = document.createElement('div');
      title.className = "fullscreen-title";
      title.innerHTML = `<span class="tz-flag">${getFlagEmoji(tz)}</span> ${tz} <span class="fullscreen-abbr">${abbr}</span> <span class="fullscreen-offset">UTC${offset}</span>`;
      content.appendChild(title);

      // Date
      const date = document.createElement('div');
      date.className = "fullscreen-date";
      date.textContent = now.format('YYYY-MM-DD (dddd)');
      content.appendChild(date);

      overlay.appendChild(content);

      drawAnalogClock(canvas, now, true);

      overlay._tz = tz;
      overlay._canvas = canvas;
      overlay._digital = digital;
      overlay._date = date;
    }

    function updateFullscreenClock() {
      const overlay = document.getElementById('fullscreenOverlay');
      if (!fullscreenZone || !overlay._tz) return;
      const tz = overlay._tz;
      const now = moment.tz(tz);
      drawAnalogClock(overlay._canvas, now, true);
      overlay._digital.textContent = now.format('HH:mm:ss');
      overlay._date.textContent = now.format('YYYY-MM-DD (dddd)');
    }
  </script>
</body>
</html>
